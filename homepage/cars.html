        <script>
        function darkMode() {
            var element = document.body;
            element.classList.toggle("dark-mode");
        }

        document.querySelectorAll('.car-card .carousel').forEach(carousel => {
            const inner = carousel.querySelector('.carousel-inner');
            inner.style.transition = 'height 0.4s';

            const setHeight = () => {
                const img = carousel.querySelector('.carousel-item.active img');
                if (img && img.complete) inner.style.height = img.offsetHeight + 'px';
            };

            carousel.addEventListener('slid.bs.carousel', setHeight);
            window.addEventListener('load', setHeight);
            window.addEventListener('resize', setHeight);
        });
        </script>
